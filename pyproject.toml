[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Production RAG Pipeline"
dependencies = [
    "fastapi",
    "uvicorn",
    "streamlit",
    "openai",
    "langchain",
    "chromadb",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "pytest",
    "requests",
    "python-docx",
    "docx2txt",
    "pdfplumber",
    "pypdf",
    "pytesseract",
    "pdf2image",
    "sentence-transformers",
    # Vishnu pipeline (W8-W11): vector stores, hybrid search, PII, prompt compression
    "aiohttp",
    "ollama",
    "qdrant-client",
    "pinecone-client",
    "cohere",
    "huggingface_hub",
    "fastembed",
    "presidio-analyzer",
    "presidio-anonymizer",
    "spacy",
    "tiktoken",
    "llmlingua>=0.2.2"
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
